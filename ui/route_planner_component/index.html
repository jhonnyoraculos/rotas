<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --navy:#072b58; --navy-2:#0a3b72; --blue:#1468b3; --sky:#55afe9;
      --ink:#0c2340; --muted:#63738a; --line:rgba(20,104,179,.17);
      --paper:rgba(250,253,255,.93); --danger:#b42342; --warning:#b56710;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button{font:inherit}
    .shell{position:relative;overflow:hidden;border:1px solid rgba(20,104,179,.17);border-radius:22px;background-color:rgba(244,249,254,.88);background-image:linear-gradient(rgba(18,82,154,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,82,154,.045) 1px,transparent 1px),linear-gradient(rgba(18,82,154,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(18,82,154,.022) 1px,transparent 1px);background-size:32px 32px,32px 32px,8px 8px,8px 8px;box-shadow:0 18px 48px rgba(7,43,88,.10)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(14px)}
    .intro{display:flex;align-items:center;gap:13px;min-width:0}
    .mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(20,104,179,.25);border-radius:10px;color:var(--blue);background:#fff;box-shadow:0 6px 16px rgba(7,43,88,.08)}
    .intro strong{display:block;font-size:13px;letter-spacing:.02em}.intro span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
    .top-actions{display:flex;align-items:center;gap:10px}.legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;white-space:nowrap}.legend i{width:9px;height:9px;border-radius:3px;background:#fff0cf;border:1px solid #e1a149}
    .new-route{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:8px 11px;color:#fff;background:linear-gradient(135deg,var(--navy-2),var(--blue));font-size:12px;font-weight:750;cursor:pointer;box-shadow:0 7px 16px rgba(9,66,126,.18)}
    .new-route:hover{filter:brightness(1.08)}
    .shell.readonly .route-actions,.shell.readonly .city-actions,.shell.readonly .add-city,.shell.readonly .new-route{display:none!important}.shell.readonly .route[draggable="false"] .route-main,.shell.readonly .city[draggable="false"]{cursor:default}.shell.readonly .grip{opacity:.5;cursor:default}
    .savebar{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid rgba(20,104,179,.16);background:rgba(247,252,255,.96);box-shadow:0 8px 20px rgba(7,43,88,.08);backdrop-filter:blur(14px)}
    .save-state{display:flex;align-items:center;gap:8px;color:#4e647d;font-size:11px}.save-state i{width:8px;height:8px;border-radius:50%;background:#e39a32;box-shadow:0 0 0 4px rgba(227,154,50,.13)}
    .save-actions{display:flex;gap:6px}.save-btn{border:1px solid rgba(20,104,179,.18);border-radius:8px;padding:6px 10px;color:#315b83;background:#fff;font-size:10.5px;font-weight:750;cursor:pointer}.save-btn:hover{background:#edf7fe}.save-btn.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--navy-2),var(--blue))}.save-btn:disabled{opacity:.42;cursor:not-allowed}
    .board-scroll{overflow-x:auto;padding:14px;scrollbar-color:rgba(20,104,179,.3) transparent}
    .board{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:10px;min-width:1240px;align-items:stretch}
    .day{display:flex;flex-direction:column;min-height:320px;height:100%;border:1px solid rgba(20,104,179,.15);border-radius:16px;background:rgba(241,247,252,.72);overflow:hidden;transition:background .18s,border-color .18s,box-shadow .18s}
    .day.is-over{border-color:rgba(20,104,179,.58);background:rgba(224,241,254,.9);box-shadow:inset 0 0 0 2px rgba(20,104,179,.10)}
    .day-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px 13px;color:#fff;background:linear-gradient(145deg,#0b477f,#072d5c);overflow:hidden}
    .day-head:after{content:"";position:absolute;right:-22px;top:-28px;width:75px;height:75px;border:1px solid rgba(255,255,255,.18);border-radius:50%}
    .day-title{font-size:12px;font-weight:850;letter-spacing:.13em}.day-meta{position:relative;z-index:1;padding:3px 7px;border:1px solid rgba(255,255,255,.19);border-radius:999px;color:rgba(255,255,255,.78);font-size:9px;font-weight:750}
    .day-list{position:relative;flex:1;min-height:270px;padding:10px 8px 18px 14px}
    .day-list:before{content:"";position:absolute;left:8px;top:13px;bottom:15px;width:1px;background:linear-gradient(var(--sky),rgba(82,167,232,.06))}
    .empty{display:grid;place-items:center;min-height:120px;margin:4px;border:1px dashed rgba(20,104,179,.24);border-radius:12px;color:#7b8ca1;font-size:11px;text-align:center;padding:20px}
    .route{position:relative;margin:0 0 9px;border:1px solid rgba(20,104,179,.19);border-radius:13px;background:var(--paper);box-shadow:0 7px 18px rgba(7,43,88,.075);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s,opacity .18s}
    .route:before{content:"";position:absolute;left:-10px;top:24px;width:10px;height:1px;background:var(--sky)}
    .route:hover{transform:translateY(-1px);border-color:rgba(20,104,179,.37);box-shadow:0 11px 25px rgba(7,43,88,.12)}
    .route.dragging,.city.dragging{opacity:.35}.route[draggable="true"] .route-main,.city[draggable="true"]{cursor:grab}.route[draggable="true"] .route-main:active,.city[draggable="true"]:active{cursor:grabbing}
    .route-head{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:start;gap:8px;padding:10px 9px 8px;border-bottom:1px solid rgba(20,104,179,.10)}
    .grip{display:grid;place-items:center;width:28px;height:28px;border:1px solid rgba(20,104,179,.14);border-radius:8px;color:#6683a4;background:#f4f8fc;font-size:13px;user-select:none}
    .route-main{min-width:0}.route-code{color:var(--blue);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:900;letter-spacing:.06em}.route-name{margin-top:2px;color:var(--ink);font-size:12px;font-weight:830;line-height:1.2;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.route-count{margin-top:4px;color:var(--muted);font-size:9.5px}
    .route-actions,.city-actions{display:flex;gap:2px;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s}.route:hover .route-actions,.route:focus-within .route-actions,.city:hover .city-actions,.city:focus-within .city-actions{opacity:1;transform:none}
    .icon-btn{display:grid;place-items:center;width:25px;height:25px;border:1px solid transparent;border-radius:7px;color:#55708f;background:transparent;cursor:pointer;font-size:12px}.icon-btn:hover{color:var(--blue);background:#edf6fd;border-color:rgba(20,104,179,.14)}.icon-btn.danger:hover{color:var(--danger);background:#fff0f3;border-color:rgba(180,35,66,.14)}
    .cities{list-style:none;margin:0;padding:6px 7px 7px;min-height:37px;transition:background .15s}.cities.is-over{background:rgba(82,167,232,.08)}
    .city{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:5px;min-height:30px;margin:2px 0;padding:3px 3px 3px 5px;border:1px solid transparent;border-radius:8px;color:#28435f;background:rgba(242,247,251,.76);font-size:10.5px;transition:background .15s,border-color .15s,transform .15s}
    .city:hover{border-color:rgba(20,104,179,.16);background:#edf6fc;transform:translateX(1px)}.node{width:7px;height:7px;margin-left:3px;border:2px solid #5aaee6;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(82,167,232,.10)}.city-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .city.condition{border-color:rgba(181,103,16,.22);background:linear-gradient(90deg,#fff5dc,#fffaf0)}.city.condition:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:#e69a32}.city.condition .node{display:grid;width:15px;height:15px;margin-left:0;border:0;background:#d98321;color:#fff;font-size:9px;font-weight:900;place-items:center;box-shadow:none}.city.condition .node:after{content:"!"}.city.condition .city-name{font-weight:720;color:#7e4a0b}
    .add-city{display:flex;align-items:center;justify-content:center;gap:5px;width:calc(100% - 14px);margin:0 7px 8px;padding:6px;border:1px dashed rgba(20,104,179,.22);border-radius:8px;color:#376d9f;background:rgba(241,248,253,.7);font-size:10px;font-weight:750;cursor:pointer}.add-city:hover{background:#e9f5fd;border-color:rgba(20,104,179,.4)}
    .note{margin:0 0 9px;padding:9px 10px;border:1px dashed rgba(20,104,179,.27);border-radius:11px;background:rgba(232,242,250,.72)}.note strong{display:block;color:#345a7e;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}.note span{display:block;margin-top:4px;color:#657a91;font-size:9px;line-height:1.35}
    .route-placeholder,.city-placeholder{border:1px dashed var(--blue);background:rgba(82,167,232,.12);border-radius:11px}.route-placeholder{height:60px;margin:0 0 9px}.city-placeholder{height:29px;margin:2px 0}
    .drop-toast{position:fixed;left:50%;bottom:12px;z-index:20;transform:translate(-50%,12px);padding:8px 11px;border-radius:9px;color:#fff;background:#7c2940;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:11px;opacity:0;pointer-events:none;transition:.2s}.drop-toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.topbar{align-items:flex-start}.legend{display:none}.savebar{align-items:flex-start;flex-direction:column}.save-actions{width:100%}.save-btn{flex:1}.board-scroll{padding:10px}.board{grid-template-columns:repeat(5,minmax(82vw,1fr));min-width:calc(410vw + 40px);scroll-snap-type:x mandatory}.day{scroll-snap-align:start}.route-actions,.city-actions{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="drop-toast"></div>
<script>
  const app=document.getElementById('app'); const toast=document.getElementById('toast');
  let board={days:[]}, savedBoard={days:[]}, history=[], redoHistory=[], drag=null, placeholder=null;
  let serverDirty=false, canServerUndo=false, canServerRedo=false, readOnly=false, syncToken=null;
  const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const nonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
  const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
  const value=(payload)=>send('streamlit:setComponentValue',{value:{...payload,nonce:nonce()}});
  const height=()=>send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight});
  const fold=(v)=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
  const clone=(value)=>JSON.parse(JSON.stringify(value));
  const isDirty=()=>JSON.stringify(board)!==JSON.stringify(savedBoard);
  function checkpoint(){history.push(clone(board));if(history.length>20)history.shift();redoHistory=[]}
  function notify(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)}
  function autoScroll(e){if(!drag)return;const scroller=document.querySelector('.board-scroll');if(scroller){const box=scroller.getBoundingClientRect();if(e.clientX<box.left+55)scroller.scrollLeft-=18;else if(e.clientX>box.right-55)scroller.scrollLeft+=18}try{const frameBox=window.frameElement.getBoundingClientRect();const pointerY=frameBox.top+e.clientY;const viewport=window.parent.innerHeight;if(pointerY<90)window.parent.scrollBy({top:-22,behavior:'auto'});else if(pointerY>viewport-90)window.parent.scrollBy({top:22,behavior:'auto'})}catch(_error){}}
  function actionButton(action,id,label,icon,danger='') {return `<button class="icon-btn ${danger}" data-action="${action}" data-id="${esc(id)}" title="${esc(label)}" aria-label="${esc(label)}">${icon}</button>`}
  function cityHtml(city){return `<li class="city ${city.condition?'condition':''}" draggable="${readOnly?'false':'true'}" data-city-id="${esc(city.id)}"><span class="node"></span><span class="city-name" title="${esc(city.name)}">${esc(city.name)}</span><span class="city-actions">${actionButton('edit_city',city.id,'Editar cidade','✎')}${actionButton('delete_city',city.id,'Remover cidade','×','danger')}</span></li>`}
  function routeHtml(route){const n=(route.cities||[]).length;return `<article class="route" draggable="${readOnly?'false':'true'}" data-route-id="${esc(route.id)}"><header class="route-head"><div class="grip" title="${readOnly?'Somente leitura':'Arraste a rota inteira'}">${readOnly?'◇':'⠿'}</div><div class="route-main"><div class="route-code">${esc(route.code)}</div><div class="route-name" title="${esc(route.name)}">${esc(route.name)}</div><div class="route-count">${n} ${n===1?'cidade':'cidades'}</div></div><div class="route-actions">${actionButton('edit_route',route.id,'Editar rota','✎')}${actionButton('delete_route',route.id,'Excluir rota','×','danger')}</div></header><ul class="cities" data-route-id="${esc(route.id)}">${(route.cities||[]).map(cityHtml).join('')}</ul><button class="add-city" data-action="add_city" data-id="${esc(route.id)}">＋ Cidade</button></article>`}
  function noteHtml(note){return `<aside class="note"><strong>◇ ${esc(note.title)}</strong>${(note.lines||[]).map(line=>`<span>${esc(line)}</span>`).join('')}</aside>`}
  function render(){const total=(day)=>day.items.filter(i=>i.kind==='route').length;const changed=isDirty();const showBar=!readOnly&&(changed||redoHistory.length||canServerRedo);const stateText=changed?'<strong>Alterações não salvas</strong> — continue organizando e salve quando terminar.':'<strong>Alteração desfeita</strong> — use Refazer para reaplicá-la.';const savebar=showBar?`<div class="savebar"><div class="save-state"><i></i><span>${stateText}</span></div><div class="save-actions"><button class="save-btn" data-local-action="undo" ${history.length||canServerUndo?'':'disabled'}>↶ Desfazer</button><button class="save-btn" data-local-action="redo" ${redoHistory.length||canServerRedo?'':'disabled'}>↷ Refazer</button><button class="save-btn" data-local-action="discard" ${changed?'':'disabled'}>Descartar</button><button class="save-btn primary" data-local-action="save" ${changed?'':'disabled'}>Salvar alterações</button></div></div>`:'';const subtitle=readOnly?'Consulta do planejamento semanal • modo somente leitura':'Arraste blocos e cidades para reorganizar a operação';app.innerHTML=`<section class="shell ${readOnly?'readonly':''}"><div class="topbar"><div class="intro"><div class="mark">⌁</div><div><strong>Mapa mestre de rotas</strong><span>${subtitle}</span></div></div><div class="top-actions"><span class="legend"><i></i> condição especial</span><button class="new-route" data-action="new_route">＋ Nova rota</button></div></div>${savebar}<div class="board-scroll"><main class="board">${board.days.map(day=>`<section class="day" data-weekday="${day.weekday}"><header class="day-head"><span class="day-title">${esc(day.label)}</span><span class="day-meta">${total(day)} ${total(day)===1?'ROTA':'ROTAS'}</span></header><div class="day-list" data-weekday="${day.weekday}">${day.items.length?day.items.map(i=>i.kind==='route'?routeHtml(i):noteHtml(i)).join(''):'<div class="empty">Nenhuma rota neste dia</div>'}</div></section>`).join('')}</main></div></section>`;bind();requestAnimationFrame(height)}
  const routeLocation=id=>{for(const day of board.days){const index=day.items.findIndex(i=>i.kind==='route'&&i.id===id);if(index>=0)return{day,index,route:day.items[index]}}};
  const cityLocation=id=>{for(const day of board.days)for(const route of day.items.filter(i=>i.kind==='route')){const index=(route.cities||[]).findIndex(c=>c.id===id);if(index>=0)return{day,route,index,city:route.cities[index]}}};
  const cityConflict=(day,name,excludeCityId=null,excludeRouteId=null)=>day.items.filter(i=>i.kind==='route'&&i.id!==excludeRouteId).flatMap(route=>route.cities||[]).find(city=>city.id!==excludeCityId&&fold(city.name)===fold(name));
  function routeCityConflict(route,targetDay){const names=new Set();for(const city of route.cities||[]){const normalized=fold(city.name);if(names.has(normalized)||cityConflict(targetDay,city.name,null,route.id))return city.name;names.add(normalized)}return null}
  function clearDrag(){document.querySelectorAll('.is-over,.dragging').forEach(e=>e.classList.remove('is-over','dragging'));placeholder?.remove();placeholder=null;drag=null}
  function bind(){
    if(readOnly)return;
    app.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();value({type:'action',action:btn.dataset.action,id:btn.dataset.id||null,board})}));
    app.querySelectorAll('[data-local-action]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const action=btn.dataset.localAction;if(action==='undo'){if(history.length){redoHistory.push(clone(board));if(redoHistory.length>20)redoHistory.shift();board=history.pop();render()}else if(canServerUndo){value({type:'undo'})}}else if(action==='redo'){if(redoHistory.length){history.push(clone(board));if(history.length>20)history.shift();board=redoHistory.pop();render()}else if(canServerRedo){value({type:'redo'})}}else if(action==='discard'){if(serverDirty){value({type:'discard'})}else{board=clone(savedBoard);history=[];redoHistory=[];render()}}else if(action==='save'){value({type:'save',board})}}));
    app.querySelectorAll('.route').forEach(el=>{
      el.addEventListener('dragstart',e=>{if(e.target.closest('.city'))return;drag={kind:'route',id:el.dataset.routeId};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.id)});
      el.addEventListener('dragend',clearDrag);
    });
    app.querySelectorAll('.city').forEach(el=>{
      el.addEventListener('dragstart',e=>{e.stopPropagation();drag={kind:'city',id:el.dataset.cityId};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.id)});
      el.addEventListener('dragend',clearDrag);
    });
    app.querySelectorAll('.day-list').forEach(list=>{
      list.addEventListener('dragover',e=>{if(!drag||drag.kind!=='route')return;e.preventDefault();list.closest('.day').classList.add('is-over');if(!placeholder){placeholder=document.createElement('div');placeholder.className='route-placeholder'}const cards=[...list.querySelectorAll('.route:not(.dragging)')];const next=cards.find(card=>e.clientY<card.getBoundingClientRect().top+card.offsetHeight/2);next?list.insertBefore(placeholder,next):list.appendChild(placeholder)});
      list.addEventListener('dragleave',e=>{if(!list.contains(e.relatedTarget))list.closest('.day').classList.remove('is-over')});
      list.addEventListener('drop',e=>{if(!drag||drag.kind!=='route')return;e.preventDefault();const source=routeLocation(drag.id);const targetDay=board.days.find(d=>d.weekday===Number(list.dataset.weekday));if(!source||!targetDay)return clearDrag();if(targetDay!==source.day&&targetDay.items.some(i=>i.kind==='route'&&i.code===source.route.code)){notify(`${source.route.code} já existe neste dia`);return clearDrag()}if(targetDay!==source.day){const conflict=routeCityConflict(source.route,targetDay);if(conflict){notify(`${conflict} já existe neste dia ou está repetida na rota`);return clearDrag()}}checkpoint();const before=placeholder?.nextElementSibling?.dataset.routeId||null;source.day.items.splice(source.index,1);let targetIndex=before?targetDay.items.findIndex(i=>i.id===before):targetDay.items.length;if(targetIndex<0)targetIndex=targetDay.items.length;targetDay.items.splice(targetIndex,0,source.route);clearDrag();render()});
    });
    app.querySelectorAll('.cities').forEach(list=>{
      list.addEventListener('dragover',e=>{if(!drag||drag.kind!=='city')return;e.preventDefault();e.stopPropagation();list.classList.add('is-over');if(!placeholder){placeholder=document.createElement('li');placeholder.className='city-placeholder'}const rows=[...list.querySelectorAll('.city:not(.dragging)')];const next=rows.find(row=>e.clientY<row.getBoundingClientRect().top+row.offsetHeight/2);next?list.insertBefore(placeholder,next):list.appendChild(placeholder)});
      list.addEventListener('dragleave',e=>{if(!list.contains(e.relatedTarget))list.classList.remove('is-over')});
      list.addEventListener('drop',e=>{if(!drag||drag.kind!=='city')return;e.preventDefault();e.stopPropagation();const source=cityLocation(drag.id),target=routeLocation(list.dataset.routeId);if(!source||!target)return clearDrag();if(cityConflict(target.day,source.city.name,source.city.id)){notify(`${source.city.name} já existe neste dia`);return clearDrag()}checkpoint();const before=placeholder?.nextElementSibling?.dataset.cityId||null;source.route.cities.splice(source.index,1);let targetIndex=before?target.route.cities.findIndex(c=>c.id===before):target.route.cities.length;if(targetIndex<0)targetIndex=target.route.cities.length;target.route.cities.splice(targetIndex,0,source.city);clearDrag();render()});
    });
  }
  document.addEventListener('dragover',autoScroll);
  window.addEventListener('message',event=>{if(event.data?.type!=='streamlit:render')return;const args=event.data.args||{};serverDirty=Boolean(args.server_dirty);canServerUndo=Boolean(args.can_server_undo);canServerRedo=Boolean(args.can_server_redo);readOnly=Boolean(args.read_only);if(syncToken!==args.sync_token){syncToken=args.sync_token;board=clone(args.board||{days:[]});savedBoard=clone(args.saved_board||{days:[]});history=[];redoHistory=[]}render()});
  new ResizeObserver(height).observe(document.body); send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
